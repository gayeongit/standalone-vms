<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 빛 번짐 효과 필터 -->
    <filter id="glow_filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.0" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="u_glow_grad" x1="12" y1="21" x2="12" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F37321" />
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- 프레임 -->
  <path d="M12 2L4 6.5V13.5C4 17.9183 7.58172 21.5 12 21.5C16.4183 21.5 20 17.9183 20 13.5V6.5L12 2Z" 
        stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 필터가 적용된 빛나는 U자 곡선 -->
  <path d="M5.5 13.5C5.5 17.0899 8.41015 20 12 20C15.5899 20 18.5 17.0899 18.5 13.5" 
        stroke="#F37321" stroke-width="2.1" stroke-linecap="round" filter="url(#glow_filter)" />

  <!-- 중앙 렌즈 (빛 효과 추가) -->
  <circle cx="12" cy="12" r="1.5" fill="#F37321" filter="url(#glow_filter)" />
</svg>
